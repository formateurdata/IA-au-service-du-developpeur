[project]
name = "portail-api"
version = "1.2.0"
description = "API du portail interne : demandes de matériel informatique"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-chroma>=1.0",
    "langchain-text-splitters>=1.0",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore::DeprecationWarning:chromadb",
]
